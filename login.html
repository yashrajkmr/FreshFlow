<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFlow | Manager Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-300 antialiased overflow-x-hidden min-h-screen flex flex-col" style="font-family:'Plus Jakarta Sans',sans-serif;">

    <!-- background -->
    <div class="fixed inset-0 z-[-20] bg-[url('https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2074&auto=format&fit=crop')] bg-cover bg-center"></div>
    <div class="fixed inset-0 z-[-15] bg-slate-950/90 backdrop-blur-[2px]"></div>
    <div class="fixed top-[-10%] left-[5%] w-[50%] h-[50%] bg-emerald-600/20 rounded-full blur-[120px] z-[-10]"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[40%] h-[40%] bg-cyan-600/10 rounded-full blur-[100px] z-[-10]"></div>

    <!-- header -->
    <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-xl border-b border-white/5 shadow-sm">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center max-w-7xl">
            <a href="/" class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-emerald-400 to-cyan-500 text-slate-950 p-2 rounded-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-white">FreshFlow<span class="text-emerald-500">.</span></h1>
            </a>
            <a href="/" class="text-slate-400 hover:text-white text-sm font-medium transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left text-xs"></i> Back to Home
            </a>
        </nav>
    </header>

    <!-- main login section -->
    <main class="flex-grow flex items-center justify-center px-6 py-20">
        <div class="w-full max-w-md">

            <!-- card -->
            <div class="glass rounded-3xl p-8 border border-white/5">

                <!-- icon + heading -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/15 border border-emerald-500/25 rounded-2xl mb-4">
                        <i class="fa-solid fa-lock text-emerald-400 text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-extrabold text-white">Manager Login</h2>
                    <p class="text-slate-400 text-sm mt-1">Sign in to access the FreshFlow console</p>
                </div>

                <!-- demo credentials hint -->
                <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl px-4 py-3 mb-6 text-xs text-slate-400">
                    <p class="font-semibold text-slate-300 mb-1"><i class="fa-solid fa-circle-info text-cyan-400 mr-1"></i> Demo Credentials</p>
                    <p>Username: <span class="text-emerald-400 font-mono">manager</span> &nbsp;|&nbsp; Password: <span class="text-emerald-400 font-mono">freshflow123</span></p>
                </div>

                <!-- login form -->
                <div id="loginForm">

                    <!-- username field -->
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wide">Username</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                            <input
                                type="text"
                                id="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                class="w-full bg-slate-800/60 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-500 transition-colors"
                                onfocus="handleFieldFocus(this)"
                                onblur="handleFieldBlur(this)"
                                oninput="clearError()"
                            >
                        </div>
                    </div>

                    <!-- password field -->
                    <div class="mb-6">
                        <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wide">Password</label>
                        <div class="relative">
                            <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                class="w-full bg-slate-800/60 border border-slate-700 rounded-xl pl-10 pr-12 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-500 transition-colors"
                                onfocus="handleFieldFocus(this)"
                                onblur="handleFieldBlur(this)"
                                oninput="clearError()"
                                onkeydown="handleKeydown(event)"
                            >
                            <!-- toggle password visibility -->
                            <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
                                <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- error message -->
                    <div id="errorMsg" class="hidden mb-4 bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-3 text-sm text-red-400 flex items-center gap-2">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="errorText">Invalid Credentials</span>
                    </div>

                    <!-- success message -->
                    <div id="successMsg" class="hidden mb-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-4 py-3 text-sm text-emerald-400 flex items-center gap-2">
                        <i class="fa-solid fa-circle-check"></i>
                        <span id="successText">Login Successful</span>
                    </div>

                    <!-- submit button -->
                    <button
                        id="loginBtn"
                        onclick="handleLogin()"
                        class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition-all duration-300 hover:shadow-[0_0_25px_rgba(16,185,129,.4)] flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login
                    </button>

                </div>

            </div>

            <!-- architecture note -->
            <p class="text-center text-xs text-slate-600 mt-6">
                Powered by <span class="text-slate-500">Express.js</span> · HTML · JavaScript · Tailwind CSS
            </p>

        </div>
    </main>

    <script>
        // focus event - highlight field with green border
        function handleFieldFocus(el) {
            el.style.borderColor = '#10b981';
            el.style.boxShadow = '0 0 0 3px rgba(16,185,129,0.15)';
        }

        // blur event - remove highlight
        function handleFieldBlur(el) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
        }

        // keydown event - submit on Enter key
        function handleKeydown(e) {
            if (e.key === 'Enter') handleLogin();
        }

        // toggle password visibility
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa-solid fa-eye-slash text-sm';
            } else {
                pwd.type = 'password';
                icon.className = 'fa-solid fa-eye text-sm';
            }
        }

        // clear error when user starts typing again
        function clearError() {
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('successMsg').classList.add('hidden');
        }

        // main login handler - sends POST request to Express backend
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            // basic client-side validation
            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            // show loading state on button
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
            btn.disabled = true;

            try {
                // send credentials to Express backend
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // login successful
                    showSuccess(`Login Successful — Welcome, ${data.role}!`);
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Logged In';
                    btn.classList.replace('bg-emerald-500', 'bg-emerald-600');

                    // redirect to main page after 1.5 seconds
                    setTimeout(() => { window.location.href = '/'; }, 1500);
                } else {
                    // invalid credentials
                    showError(data.message);
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
                    btn.disabled = false;
                }

            } catch (err) {
                // network or server error
                showError('Server error. Please try again.');
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
                btn.disabled = false;
            }
        }

        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorMsg').classList.remove('hidden');
            document.getElementById('successMsg').classList.add('hidden');
        }

        function showSuccess(msg) {
            document.getElementById('successText').textContent = msg;
            document.getElementById('successMsg').classList.remove('hidden');
            document.getElementById('errorMsg').classList.add('hidden');
        }
    </script>

</body>
</html>
